CONFIG_BOOT_BANNER=n
CONFIG_ZMK_SPLIT=y
# The GPIO LED standing in for the PWM LED of real hardware.
CONFIG_GPIO=y
CONFIG_LED=y
# ZMK's own battery reporting, sampling every second, in its default
# state-of-charge mode, and publishing through BAS.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=1
