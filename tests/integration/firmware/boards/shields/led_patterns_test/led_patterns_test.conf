CONFIG_PWM=y

# Device power management, so the two power-off devices that write the LED
# dark before the SoC goes off are built and checked.
CONFIG_PM_DEVICE=y

# ZMK's battery reporting, which reads the chosen zmk,battery: the LED battery
# wrapper has to be what it links against, in the fetch mode it serves.
CONFIG_ZMK_BATTERY_REPORTING=y
